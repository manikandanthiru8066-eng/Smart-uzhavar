server:
  port: 8081

spring:
  application:
    name: insurance-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartuzhavar}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:614613}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  jwt:
    # Match the JWT secret and expiration with subsidyservice so the same tokens work
    secret: 9a67471b7f1910d2ee81363241b1b8b64e56b8564e56b8564e56b8564e56b856
    expiration-ms: 86400000 # 24 hours

logging:
  level:
    org.springframework.security: INFO
    org.springframework.web: INFO
    com.smartuzhavar.insuranceservice: DEBUG
